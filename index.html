<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanji Quizzer</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#222; --muted:#888; --accent:#c0392b; --ok:#2e8b57; --bad:#c0392b; --line:#e5e0d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --card:#202026; --ink:#eee; --muted:#999; --line:#33333b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 16px; } h1 span { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  label { cursor:pointer; }
  button { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border:none; }
  #prompt { font-size:6rem; text-align:center; line-height:1.2; font-family:"Noto Serif JP","Yu Mincho",serif; }
  #hint { text-align:center; color:var(--muted); min-height:1.4em; }
  #choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #choices button { min-height:56px; font-size:1.05rem; }
  .ok { background:var(--ok)!important; color:#fff!important; }
  .bad { background:var(--bad)!important; color:#fff!important; }
  input[type=text], textarea { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  #stats { display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; }
  #grid { display:flex; flex-wrap:wrap; gap:3px; }
  #grid div { width:30px; height:30px; display:grid; place-items:center; border-radius:4px; font-size:1rem; }
  .hidden { display:none; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>漢字 <span>Quizzer</span></h1>

  <!-- Setup screen -->
  <section id="setup">
    <div class="card">
      <b>Decks</b>
      <div class="row" id="deckList"></div>
    </div>
    <div class="card">
      <b>Mode</b>
      <div class="row">
        <label><input type="radio" name="mode" value="mc" checked> Multiple choice</label>
        <label><input type="radio" name="mode" value="type"> Type answer</label>
      </div>
      <b>Kanji: ask for</b>
      <div class="row">
        <label><input type="radio" name="ask" value="meaning" checked> Meaning</label>
        <label><input type="radio" name="ask" value="reading"> Reading</label>
      </div>
    </div>
    <div class="card">
      <b>Custom deck</b> <small>one per line: <code>漢|meaning1,meaning2|カン・よみ</code></small>
      <textarea id="custom" rows="4" placeholder="猫|cat|ビョウ・ねこ"></textarea>
    </div>
    <div class="row">
      <button class="primary" id="startBtn">Start</button>
      <button id="resetBtn">Reset progress</button>
    </div>
    <div class="card" style="margin-top:12px">
      <b>Progress</b> <small>(red = weak, green = learned)</small>
      <div id="grid" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- Quiz screen -->
  <section id="quiz" class="hidden">
    <div id="stats"><span id="score"></span><span id="streak"></span></div>
    <div class="card">
      <div id="prompt"></div>
      <div id="hint"></div>
    </div>
    <div id="choices"></div>
    <form id="typeForm" class="hidden"><input type="text" id="answer" autocomplete="off" placeholder="Type answer, Enter"></form>
    <div class="row" style="justify-content:space-between;margin-top:12px">
      <button id="backBtn">← Back</button>
      <small>Keys: 1–4 to pick, Enter to continue</small>
    </div>
  </section>
</main>

<script>

const KATA = "アa イi ウu エe オo カka キki クku ケke コko サsa シshi スsu セse ソso タta チchi ツtsu テte トto ナna ニni ヌnu ネne ノno ハha ヒhi フfu ヘhe ホho マma ミmi ムmu メme モmo ヤya ユyu ヨyo ラra リri ルru レre ロro ワwa ヲwo ンn";
const kana = s => s.split(" ").map(t => ({ c: t[0], m: [t.slice(1)], r: "" }));

const N5 = `一|one|イチ・ひと

多|many,much|タ・おお`;

const parse = txt => txt.trim().split("\n").filter(Boolean).map(l => {
  const [c, m = "", r = ""] = l.split("|").map(s => s.trim());
  return { c, m: m.split(",").map(s => s.trim()), r };
});

const DECKS = {
  hiragana: { name: "Hiragana", items: kana(HIRA), kanji: false },
  katakana: { name: "Katakana", items: kana(KATA), kanji: false },
  n5:       { name: "Kanji N5", items: parse(N5),  kanji: true  },
  // N4–N1 come from the JLPT data script above
  ...Object.fromEntries(["n4", "n3", "n2", "n1"].map(k =>
    [k, { name: `Kanji ${k.toUpperCase()}`, items: parse(JLPT[k]), kanji: true }])),
  custom:   { name: "Custom",   items: [],         kanji: true  },
};

// ---- Persistence (localStorage) ----
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let prog = store.get("kq_prog", {});      // { char: {ok, bad} }
const $ = id => document.getElementById(id);

// ---- Setup UI ----
const saved = store.get("kq_settings", { decks: ["hiragana"], mode: "mc", ask: "meaning", custom: "" });
$("custom").value = saved.custom;
$("deckList").innerHTML = Object.entries(DECKS).map(([k, d]) =>
  `<label><input type="checkbox" value="${k}" ${saved.decks.includes(k) ? "checked" : ""}> ${d.name}</label>`).join("");
document.querySelector(`[name=mode][value=${saved.mode}]`).checked = true;
document.querySelector(`[name=ask][value=${saved.ask}]`).checked = true;

function drawGrid() {
  // Only show selected decks (all of them would be ~2300 cells)
  const sel = [...document.querySelectorAll("#deckList input:checked")].map(i => i.value);
  const all = sel.flatMap(k => DECKS[k].items);
  $("grid").innerHTML = all.map(it => {
    const p = prog[it.c];
    let bg = "var(--line)";
    if (p) { // hue 0 (red) → 120 (green) by accuracy, weighted by attempts
      const acc = p.ok / (p.ok + p.bad), conf = Math.min(1, (p.ok + p.bad) / 5);
      bg = `hsla(${acc * 120},60%,45%,${0.25 + 0.75 * conf})`;
    }
    return `<div style="background:${bg}" title="${it.m.join(", ")}">${it.c}</div>`;
  }).join("");
}
DECKS.custom.items = parse(saved.custom);
drawGrid();
$("deckList").onchange = drawGrid;

// ---- Quiz state ----
let pool = [], cfg, cur, answered, score = 0, total = 0, streak = 0;

// Weighted pick: weak / unseen items come up more often
function weight(it) {
  const p = prog[it.c] || { ok: 0, bad: 0 };
  return (1 + p.bad * 2) / (1 + p.ok);
}
function pick() {
  let sum = pool.reduce((s, it) => s + weight(it), 0), r = Math.random() * sum;
  for (const it of pool) { if ((r -= weight(it)) <= 0 && it !== cur) return it; }
  return pool.find(it => it !== cur) || pool[0];
}

// What the answer looks like for an item (string shown on buttons)
const label = it => (it.kanji && cfg.ask === "reading") ? it.r : it.m.join(", ");

// Katakana → hiragana so typed readings match either script
const toHira = s => s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));

function next() {
  answered = false;
  cur = pick();
  $("prompt").textContent = cur.c;
  $("hint").textContent = "";
  $("score").textContent = `${score} / ${total}`;
  $("streak").textContent = `🔥 ${streak}`;

  if (cfg.mode === "mc") {
    // 3 distractors from items of the same kind with a different label
    const same = pool.filter(it => it.kanji === cur.kanji && label(it) !== label(cur));
    const opts = [cur];
    while (opts.length < 4 && same.length) opts.push(same.splice(Math.random() * same.length | 0, 1)[0]);
    opts.sort(() => Math.random() - .5);
    $("choices").innerHTML = opts.map((o, i) => `<button data-c="${o.c}">${i + 1}. ${label(o)}</button>`).join("");
  } else {
    $("answer").value = "";
    $("answer").focus();
  }
}

function grade(correct) {
  answered = true;
  total++;
  const p = prog[cur.c] ||= { ok: 0, bad: 0 };
  correct ? (score++, streak++, p.ok++) : (streak = 0, p.bad++);
  store.set("kq_prog", prog);
  $("hint").innerHTML = (correct ? "✅ " : "❌ ") + label(cur) + (cur.kanji && cfg.ask === "meaning" && cur.r ? ` <small>(${cur.r})</small>` : "");
  $("score").textContent = `${score} / ${total}`;
  $("streak").textContent = `🔥 ${streak}`;
  if (correct) setTimeout(() => answered && next(), 700); // auto-advance on correct
}

// ---- Events ----
$("choices").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (answered) return next();
  const ok = b.dataset.c === cur.c;
  [...$("choices").children].forEach(x => x.dataset.c === cur.c && x.classList.add("ok"));
  if (!ok) b.classList.add("bad");
  grade(ok);
};

$("typeForm").onsubmit = e => {
  e.preventDefault();
  if (answered) return next();
  const a = $("answer").value.trim().toLowerCase();
  if (!a) return;
  let ok;
  if (cur.kanji && cfg.ask === "reading")
    ok = cur.r.split("・").some(r => toHira(r) === toHira(a)); // needs Japanese IME
  else
    ok = cur.m.some(m => m.toLowerCase() === a);
  grade(ok);
};

document.onkeydown = e => {
  if ($("quiz").classList.contains("hidden") || cfg.mode !== "mc") return;
  const n = +e.key;
  if (n >= 1 && n <= 4) $("choices").children[n - 1]?.click();
  else if (e.key === "Enter" && answered) next();
};

$("startBtn").onclick = () => {
  cfg = {
    decks: [...document.querySelectorAll("#deckList input:checked")].map(i => i.value),
    mode: document.querySelector("[name=mode]:checked").value,
    ask: document.querySelector("[name=ask]:checked").value,
    custom: $("custom").value,
  };
  store.set("kq_settings", cfg);
  DECKS.custom.items = parse(cfg.custom);
  pool = cfg.decks.flatMap(k => DECKS[k].items.map(it => ({ ...it, kanji: DECKS[k].kanji })));
  if (pool.length < 2) return alert("Pick at least one deck with 2+ items.");
  score = total = streak = 0;
  $("choices").classList.toggle("hidden", cfg.mode !== "mc");
  $("typeForm").classList.toggle("hidden", cfg.mode === "mc");
  $("setup").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  cur = null;
  next();
};

$("backBtn").onclick = () => {
  $("quiz").classList.add("hidden");
  $("setup").classList.remove("hidden");
  drawGrid();
};

$("resetBtn").onclick = () => {
  if (confirm("Reset all progress?")) { prog = {}; store.set("kq_prog", prog); drawGrid(); }
};
