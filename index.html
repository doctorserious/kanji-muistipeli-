<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanji Quizzer</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#222; --muted:#888; --accent:#c0392b; --ok:#2e8b57; --bad:#c0392b; --line:#e5e0d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --card:#202026; --ink:#eee; --muted:#999; --line:#33333b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 16px; } h1 span { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  label { cursor:pointer; }
  button { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border:none; }
  #prompt { font-size:6rem; text-align:center; line-height:1.2; font-family:"Noto Serif JP","Yu Mincho",serif; }
  #hint { text-align:center; color:var(--muted); min-height:1.4em; }
  #choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #prompt.txt { font-size:1.8rem; font-family:inherit; padding:24px 0; }
  .jp { font-family:"Noto Serif JP","Yu Mincho",serif; }
  #choices button.jp { font-size:2rem; }
  #choices small { opacity:.5; font-size:.75rem; }
  #examples { margin-top:10px; line-height:1.7; }
  #examples .jp { font-size:1.2rem; }
  select { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  #choices button { min-height:56px; font-size:1.05rem; }
  .ok { background:var(--ok)!important; color:#fff!important; }
  .bad { background:var(--bad)!important; color:#fff!important; }
  input[type=text], textarea { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  #stats { display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; }
  #grid { display:flex; flex-wrap:wrap; gap:3px; }
  #grid div { width:30px; height:30px; display:grid; place-items:center; border-radius:4px; font-size:1rem; }
  .hidden { display:none; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>漢字 <span>Quizzer</span></h1>

  <!-- Setup screen -->
  <section id="setup">
    <div class="card">
      <b>Decks</b>
      <div class="row" id="deckList"></div>
    </div>
    <div class="card">
      <b>Mode</b>
      <div class="row">
        <label><input type="radio" name="mode" value="mc" checked> Multiple choice</label>
        <label><input type="radio" name="mode" value="type"> Type answer</label>
      </div>
    </div>
    <div class="card">
      <b>Custom deck</b> <small>one per line: <code>漢|meaning1,meaning2|カン・よみ</code></small>
      <textarea id="custom" rows="4" placeholder="猫|cat|ビョウ・ねこ"></textarea>
    </div>
    <div class="row">
      <button class="primary" id="startBtn">Start</button>
      <button id="resetBtn">Reset progress</button>
    </div>
    <div class="card" style="margin-top:12px">
      <b>Progress</b> <small>(red = weak, green = learned)</small>
      <div id="grid" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- Quiz screen -->
  <section id="quiz" class="hidden">
    <div class="row" id="toolbar">
      <button id="dirBtn"></button>
      <button id="askBtn"></button>
      <select id="gridSel"><option value="4">2×2</option><option value="6">3×2</option><option value="9">3×3</option></select>
    </div>
    <div id="stats"><span id="score"></span><span id="streak"></span></div>
    <div class="card">
      <div id="prompt"></div>
      <div id="hint"></div>
      <div id="examples"></div>
    </div>
    <div id="choices"></div>
    <form id="typeForm" class="hidden"><input type="text" id="answer" autocomplete="off" placeholder="Type answer, Enter"></form>
    <div class="row" style="justify-content:space-between;margin-top:12px">
      <button id="backBtn">← Back</button>
      <button id="nextBtn" class="primary hidden">Next →</button>
      <small>Keys: 1–9, Enter</small>
    </div>
  </section>
</main>

平たい|ひらたい|flat, even
比率|ひりつ|ratio, proportion`;
</script>
<script>
// ---- Data: "char|answers(comma-separated)|reading" ----
const HIRA = "あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をwo んn";
const KATA = "アa イi ウu エe オo カka キki クku ケke コko サsa シshi スsu セse ソso タta チchi ツtsu テte トto ナna ニni ヌnu ネne ノno ハha ヒhi フfu ヘhe ホho マma ミmi ムmu メme モmo ヤya ユyu ヨyo ラra リri ルru レre ロro ワwa ヲwo ンn";
const kana = s => s.split(" ").map(t => ({ c: t[0], m: [t.slice(1)], r: "" }));

const N5 = `一|one|イチ・ひと
二|two|ニ・ふた
三|three|サン・みっ
四|four|シ・よん・よ
五|five|ゴ・いつ
六|six|ロク・むっ
七|seven|シチ・なな
八|eight|ハチ・やっ
九|nine|キュウ・ク・ここの
十|ten|ジュウ・とお
百|hundred|ヒャク
千|thousand|セン・ち
万|ten thousand|マン・バン
円|yen,circle|エン・まる
日|day,sun|ニチ・ジツ・ひ・か
月|month,moon|ゲツ・ガツ・つき
火|fire|カ・ひ
水|water|スイ・みず
木|tree,wood|モク・ボク・き
金|gold,money|キン・かね
土|earth,soil|ド・ト・つち
曜|weekday|ヨウ
年|year|ネン・とし
時|time,hour|ジ・とき
分|minute,part|フン・ブン・わ
半|half|ハン・なか
今|now|コン・いま
何|what|カ・なに・なん
人|person|ジン・ニン・ひと
子|child|シ・こ
女|woman|ジョ・おんな
男|man|ダン・ナン・おとこ
父|father|フ・ちち
母|mother|ボ・はは
友|friend|ユウ・とも
先|previous,ahead|セン・さき
生|life,birth|セイ・ショウ・い・う
学|study,learning|ガク・まな
校|school|コウ
本|book,origin|ホン・もと
名|name|メイ・ミョウ・な
山|mountain|サン・やま
川|river|セン・かわ
田|rice field|デン・た
天|heaven,sky|テン・あま
気|spirit,air|キ・ケ
雨|rain|ウ・あめ
花|flower|カ・はな
上|up,above|ジョウ・うえ・あ
下|down,below|カ・ゲ・した・さ
中|middle,inside|チュウ・なか
外|outside|ガイ・ゲ・そと
右|right|ウ・ユウ・みぎ
左|left|サ・ひだり
前|before,front|ゼン・まえ
後|after,behind|ゴ・コウ・あと・うし
東|east|トウ・ひがし
西|west|セイ・サイ・にし
南|south|ナン・みなみ
北|north|ホク・きた
大|big|ダイ・タイ・おお
小|small|ショウ・ちい・こ
長|long,leader|チョウ・なが
高|tall,expensive|コウ・たか
安|cheap,peaceful|アン・やす
新|new|シン・あたら
古|old|コ・ふる
白|white|ハク・しろ
見|see|ケン・み
行|go|コウ・ギョウ・い・おこな
来|come|ライ・く・き
出|exit,go out|シュツ・で・だ
入|enter|ニュウ・はい・い
食|eat,food|ショク・た
飲|drink|イン・の
言|say,word|ゲン・ゴン・い・こと
話|talk,story|ワ・はな・はなし
読|read|ドク・よ
書|write|ショ・か
聞|hear,listen,ask|ブン・き
休|rest|キュウ・やす
買|buy|バイ・か
立|stand|リツ・た
会|meet,meeting|カイ・あ
社|company,shrine|シャ・やしろ
国|country|コク・くに
語|language,word|ゴ・かた
車|car,vehicle|シャ・くるま
電|electricity|デン
道|road,way|ドウ・みち
駅|station|エキ
店|shop,store|テン・みせ
手|hand|シュ・て
足|foot,leg,enough|ソク・あし・た
目|eye|モク・め
耳|ear|ジ・みみ
口|mouth|コウ・ク・くち
午|noon|ゴ
毎|every|マイ
週|week|シュウ
少|few,little|ショウ・すく・すこ
多|many,much|タ・おお`;

const parse = txt => txt.trim().split("\n").filter(Boolean).map(l => {
  const [c, m = "", r = ""] = l.split("|").map(s => s.trim());
  return { c, m: m.split(",").map(s => s.trim()), r };
});

const DECKS = {
  hiragana: { name: "Hiragana", items: kana(HIRA), kanji: false },
  katakana: { name: "Katakana", items: kana(KATA), kanji: false },
  n5:       { name: "Kanji N5", items: parse(N5),  kanji: true  },
  // N4–N1 come from the JLPT data script above
  ...Object.fromEntries(["n4", "n3", "n2", "n1"].map(k =>
    [k, { name: `Kanji ${k.toUpperCase()}`, items: parse(JLPT[k]), kanji: true }])),
  custom:   { name: "Custom",   items: [],         kanji: true  },
};

// ---- Persistence (localStorage) ----
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let prog = store.get("kq_prog", {});      // { char: {ok, bad} }
const $ = id => document.getElementById(id);

// ---- Setup UI ----
const saved = { decks: ["hiragana"], mode: "mc", ask: "meaning", dir: "fwd", grid: "4", custom: "", ...store.get("kq_settings", {}) };
$("custom").value = saved.custom;
$("deckList").innerHTML = Object.entries(DECKS).map(([k, d]) =>
  `<label><input type="checkbox" value="${k}" ${saved.decks.includes(k) ? "checked" : ""}> ${d.name}</label>`).join("");
document.querySelector(`[name=mode][value=${saved.mode}]`).checked = true;

function drawGrid() {
  // Only show selected decks (all of them would be ~2300 cells)
  const sel = [...document.querySelectorAll("#deckList input:checked")].map(i => i.value);
  const all = sel.flatMap(k => DECKS[k].items);
  $("grid").innerHTML = all.map(it => {
    const p = prog[it.c];
    let bg = "var(--line)";
    if (p) { // hue 0 (red) → 120 (green) by accuracy, weighted by attempts
      const acc = p.ok / (p.ok + p.bad), conf = Math.min(1, (p.ok + p.bad) / 5);
      bg = `hsla(${acc * 120},60%,45%,${0.25 + 0.75 * conf})`;
    }
    return `<div style="background:${bg}" title="${it.m.join(", ")}">${it.c}</div>`;
  }).join("");
}
DECKS.custom.items = parse(saved.custom);
drawGrid();
$("deckList").onchange = drawGrid;

// ---- Quiz state ----
let pool = [], cur, answered, score = 0, total = 0, streak = 0;
const cfg = saved; // live settings, saved on change

// Example words: [word, reading, meaning], ordered N5 → N1
const WL = WORDS.trim().split("\n").map(l => l.split("|"));

// Weighted pick: weak / unseen items come up more often
function weight(it) {
  const p = prog[it.c] || { ok: 0, bad: 0 };
  return (1 + p.bad * 2) / (1 + p.ok);
}
function pick() {
  let sum = pool.reduce((s, it) => s + weight(it), 0), r = Math.random() * sum;
  for (const it of pool) { if ((r -= weight(it)) <= 0 && it !== cur) return it; }
  return pool.find(it => it !== cur) || pool[0];
}

// The English/kana side of an item (kana decks always use romaji)
const label = it => (it.kanji && cfg.ask === "reading") ? it.r : it.m.join(", ");
const rev = () => cfg.dir === "rev"; // reverse: show label, pick character

// Katakana → hiragana so typed readings match either script
const toHira = s => s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));

function updateToolbar() {
  const side = cfg.ask === "reading" ? "かな" : "English";
  $("dirBtn").textContent = rev() ? `${side} → 漢` : `漢 → ${side}`;
  $("askBtn").textContent = `Answers: ${side}`;
  $("gridSel").value = cfg.grid;
  store.set("kq_settings", cfg);
}

function next() { cur = pick(); render(); }

function render() {
  answered = false;
  $("prompt").textContent = rev() ? label(cur) : cur.c;
  $("prompt").classList.toggle("txt", rev());
  $("hint").textContent = "";
  $("examples").innerHTML = "";
  $("nextBtn").classList.add("hidden");
  $("score").textContent = `${score} / ${total}`;
  $("streak").textContent = `🔥 ${streak}`;

  if (cfg.mode === "mc") {
    // Distractors: same kind (kana/kanji), different label so only one answer fits
    const n = +cfg.grid;
    const same = pool.filter(it => it.kanji === cur.kanji && it.c !== cur.c && label(it) !== label(cur));
    const opts = [cur];
    while (opts.length < n && same.length) opts.push(same.splice(Math.random() * same.length | 0, 1)[0]);
    opts.sort(() => Math.random() - .5);
    $("choices").style.gridTemplateColumns = `repeat(${n === 4 ? 2 : 3}, 1fr)`;
    $("choices").innerHTML = opts.map((o, i) =>
      `<button data-c="${o.c}" class="${rev() ? "jp" : ""}"><small>${i + 1}</small> ${rev() ? o.c : label(o)}</button>`).join("");
  } else {
    $("answer").value = "";
    $("answer").placeholder = rev() ? "Type the character (JP keyboard)" : "Type answer, Enter";
    $("answer").focus();
  }
}

function grade(correct) {
  answered = true;
  total++;
  const p = prog[cur.c] ||= { ok: 0, bad: 0 };
  correct ? (score++, streak++, p.ok++) : (streak = 0, p.bad++);
  store.set("kq_prog", prog);
  $("hint").innerHTML = `${correct ? "✅" : "❌"} <b>${cur.c}</b> — ${cur.m.join(", ")}` + (cur.r ? ` <small>(${cur.r})</small>` : "");
  $("score").textContent = `${score} / ${total}`;
  $("streak").textContent = `🔥 ${streak}`;

  // Up to 3 example words containing this kanji
  const ex = cur.kanji ? WL.filter(w => w[0].includes(cur.c)).slice(0, 3) : [];
  $("examples").innerHTML = ex.map(([w, r, m]) => `<div><span class="jp">${w}</span> <small>${r}</small> — ${m}</div>`).join("");
  $("nextBtn").classList.remove("hidden");
  // Auto-advance only when there's nothing extra to read
  if (correct && !ex.length) setTimeout(() => answered && next(), 700);
}

// ---- Events ----
$("choices").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (answered) return next();
  const ok = b.dataset.c === cur.c;
  [...$("choices").children].forEach(x => x.dataset.c === cur.c && x.classList.add("ok"));
  if (!ok) b.classList.add("bad");
  grade(ok);
};

$("typeForm").onsubmit = e => {
  e.preventDefault();
  if (answered) return next();
  const a = $("answer").value.trim().toLowerCase();
  if (!a) return;
  let ok;
  if (rev()) ok = a === cur.c.toLowerCase();
  else if (cur.kanji && cfg.ask === "reading")
    ok = cur.r.split("・").some(r => toHira(r) === toHira(a)); // needs Japanese IME
  else ok = cur.m.some(m => m.toLowerCase() === a);
  grade(ok);
};

document.onkeydown = e => {
  if ($("quiz").classList.contains("hidden") || cfg.mode !== "mc") return;
  const n = +e.key;
  if (n >= 1 && n <= 9) $("choices").children[n - 1]?.click();
  else if (e.key === "Enter" && answered) next();
};

// In-game toggles: re-render the same question with new settings
$("dirBtn").onclick = () => { cfg.dir = rev() ? "fwd" : "rev"; updateToolbar(); render(); };
$("askBtn").onclick = () => { cfg.ask = cfg.ask === "reading" ? "meaning" : "reading"; updateToolbar(); render(); };
$("gridSel").onchange = e => { cfg.grid = e.target.value; updateToolbar(); render(); };
$("nextBtn").onclick = next;

$("startBtn").onclick = () => {
  cfg.decks = [...document.querySelectorAll("#deckList input:checked")].map(i => i.value);
  cfg.mode = document.querySelector("[name=mode]:checked").value;
  cfg.custom = $("custom").value;
  updateToolbar();
  DECKS.custom.items = parse(cfg.custom);
  pool = cfg.decks.flatMap(k => DECKS[k].items.map(it => ({ ...it, kanji: DECKS[k].kanji })));
  if (pool.length < 2) return alert("Pick at least one deck with 2+ items.");
  score = total = streak = 0;
  $("choices").classList.toggle("hidden", cfg.mode !== "mc");
  $("typeForm").classList.toggle("hidden", cfg.mode === "mc");
  $("gridSel").classList.toggle("hidden", cfg.mode !== "mc");
  $("setup").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  cur = null;
  next();
};

$("backBtn").onclick = () => {
  $("quiz").classList.add("hidden");
  $("setup").classList.remove("hidden");
  drawGrid();
};

$("resetBtn").onclick = () => {
  if (confirm("Reset all progress?")) { prog = {}; store.set("kq_prog", prog); drawGrid(); }
};
</script>
